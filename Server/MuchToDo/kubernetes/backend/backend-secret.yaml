apiVersion: v1
kind: Secret
metadata:
  name: backend-secret
  namespace: muchtodo
type: Opaque
stringData:
  JWT_SECRET_KEY: kubernetes-secret-key
  MONGO_URI: mongodb://mongodb-service:27017/much_todo_db
  .env: |
    PORT=8080
    MONGO_URI=mongodb://mongodb-service:27017/much_todo_db
    DB_NAME=much_todo_db
    JWT_SECRET_KEY=kubernetes-secret-key
    JWT_EXPIRATION_HOURS=72
    ENABLE_CACHE=false
    REDIS_ADDR=
    REDIS_PASSWORD=
    LOG_LEVEL=DEBUG
    LOG_FORMAT=text
